name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  android:
    name: Android (MVVM, MVI, MVP, KMP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug y release (R8) de las apps Android + AAB de :app
        run: ./gradlew assembleDebug assembleRelease :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            */build/outputs/apk/**/*.apk
            app/build/outputs/bundle/release/*.aab
      - name: Probar la firma de release con un keystore temporal
        env:
          RELEASE_STORE_FILE: ci-release.jks
          RELEASE_STORE_PASSWORD: ci-password
          RELEASE_KEY_ALIAS: upload
          RELEASE_KEY_PASSWORD: ci-password
        run: |
          keytool -genkeypair -noprompt -keystore signing/ci-release.jks -alias upload \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-password -keypass ci-password -dname "CN=CI Signing Test"
          ./gradlew :app:assembleRelease --stacktrace
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee /dev/stderr | grep -q "CN=CI Signing Test"

  ios:
    name: iOS (KMP)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Compilar el framework de iOS (Kotlin/Native)
        run: ./gradlew :app-kmp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Generar el proyecto de Xcode y compilar iosApp
        run: |
          brew install xcodegen
          cd iosApp
          xcodegen generate
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
