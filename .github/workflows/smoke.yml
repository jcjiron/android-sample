name: Smoke test (abrir las apps)

# Abre las apps de verdad en un emulador (builds release con R8) y prueba los 4 componentes
# de :app. Es más lento que CI, por eso corre en ramas de trabajo y a mano desde Actions.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

jobs:
  android:
    name: Android en emulador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release (R8) de las 3 apps
        run: ./gradlew :app:assembleRelease :app-mvi:assembleRelease :app-mvp:assembleRelease
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir las apps y probar los componentes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/smoke-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-android
          path: smoke/
