name: Smoke test (abrir las apps)

# Abre cada app de verdad: Android en emulador (builds release con R8) e iOS en simulador.
# Es más lento que CI, por eso corre en ramas de trabajo y a mano desde la pestaña Actions.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

jobs:
  android:
    name: Android en emulador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release (R8) de las 4 apps Android
        run: ./gradlew :app:assembleRelease :app-mvi:assembleRelease :app-mvp:assembleRelease :app-kmp:assembleRelease
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir cada app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/smoke-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-android
          path: smoke/

  ios:
    name: iOS en simulador
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Compilar iosApp
        run: |
          brew install xcodegen
          cd iosApp
          xcodegen generate
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Abrir la app en el simulador
        run: bash .github/scripts/smoke-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-ios
          path: smoke/
